name: Playwright Cucumber Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select environment'
        required: true
        default: 'test'
        type: choice
        options:
          - test
      test_type:
        description: 'Select test type'
        required: true
        default: 'test:ui:ci'
        type: choice
        options:
          - test:ui:ci
          - test:crud

jobs:
  test:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build Docker image
      run: docker build -t playwright-cucumber .

    - name: Run Playwright Cucumber tests in Docker
      run: |
        docker run --rm \
          --ipc=host \
          -e TRELLO_API_KEY="${{ secrets.TRELLO_API_KEY }}" \
          -e TRELLO_API_TOKEN="${{ secrets.TRELLO_API_TOKEN }}" \
          -e TRELLO_BOARD_ID="${{ secrets.TRELLO_BOARD_ID }}" \
          -e TRELLO_BOARD_LIST_ID="${{ secrets.TRELLO_BOARD_LIST_ID }}" \
          -e TRELLO_LOGIN_EMAIL="${{ secrets.TRELLO_LOGIN_EMAIL }}" \
          -e TRELLO_LOGIN_PASSWORD="${{ secrets.TRELLO_LOGIN_PASSWORD }}" \
          -e TRELLO_2FA_SETUP_KEY="${{ secrets.TRELLO_2FA_SETUP_KEY }}" \
          -v $(pwd)/screenshots:/app/screenshots \
          -v $(pwd)/cucumber-json:/app/cucumber-json \
          -v $(pwd)/playwright-report:/app/playwright-report \
          -v $(pwd)/test-results:/app/test-results \
          playwright-cucumber npm run ${{ github.event.inputs.test_type || 'test:ui:ci' }}

    - name: Upload Error Screenshots
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: error-screenshots
        path: screenshots/*.png
        if-no-files-found: ignore
    
    - name: Upload Playwright test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/

    - name: Upload Cucumber test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: cucumber-report
        path: cucumber-json/

    - name: Upload Playwright traces
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-traces
        path: test-results/